<div class="space-y-6">
    <h1 class="text-3xl font-heading font-bold">📬 Contacto</h1>
    <p class="text-gray-400">¿Quieres comunicarte con nosotros? ¡Escríbenos!</p>
    
    <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-[#0a0a14] border border-white/5 rounded-2xl p-6 space-y-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                    <i class="fas fa-phone text-xl"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-400">Teléfono</p>
                    <p class="font-medium text-white">+591 2 123 4567</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                    <i class="fas fa-envelope text-xl"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-400">Email</p>
                    <p class="font-medium text-white">info@radiotropical.com</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                    <i class="fas fa-map-marker-alt text-xl"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-400">Dirección</p>
                    <p class="font-medium text-white">Mapiri, La Paz - Bolivia</p>
                </div>
            </div>
        </div>
        
        <div class="bg-[#0a0a14] border border-white/5 rounded-2xl p-6">
            <h4 class="font-heading text-lg font-bold mb-4">Envíanos un mensaje</h4>
            <form class="space-y-4" id="contactForm">
                <input type="text" placeholder="Tu nombre" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:outline-none transition-colors">
                <input type="email" placeholder="Tu email" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:outline-none transition-colors">
                <textarea rows="4" placeholder="Mensaje" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:outline-none transition-colors resize-none"></textarea>
                <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-cyan-600 to-cyan-400 rounded-xl font-bold text-white hover:scale-105 transition-transform shadow-lg shadow-cyan-500/30">
                    <i class="fas fa-paper-plane"></i> Enviar mensaje
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('contactForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('¡Mensaje enviado! Nos pondremos en contacto contigo pronto.');
                form.reset();
            });
        }
    });
</script>
