<footer class="floating-footer" id="floatingFooter">
    <div class="inner">
        <!-- Izquierda: Logo + Info -->
        <div class="logo-area">
            <div class="relative flex-shrink-0">
                <img src="assets/img/RT.png"
                    class="logo-img"
                    alt="Radio Tropical"
                    onerror="this.style.display='none'">
            </div>
            <div class="flex flex-col leading-tight truncate min-w-0">
                <h4 class="station-name">Radio Tropical 87.9 FM</h4>
                <div class="status-indicator">
                    <span id="liveIndicatorFloat" class="status-dot-float"></span>
                    <span id="statusTextFloat" class="status-text-float">Señal Digital</span>
                </div>
            </div>
        </div>

        <!-- Derecha: Botón Play -->
        <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0 pl-1">
            <span id="actionLabel" class="action-label">Escuchar ahora</span>
            <button id="playBtn" class="play-btn" aria-label="Reproducir / Pausar">
                <i id="btnIcon" class="fas fa-play"></i>
                <span id="loadingRing" class="loading-ring"></span>
            </button>
        </div>
    </div>
</footer>

<!-- Estilos del footer flotante -->
<style>
.floating-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(1, 2, 8, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(6, 182, 212, 0.15);
    padding: 8px 16px;
    z-index: 1050;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
}

.inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
}

.logo-img {
    height: 40px;
    width: auto;
    border-radius: 6px;
}

.station-name {
    color: #e2e8f0;
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0;
    line-height: 1.2;
}

.status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
}

.status-dot-float {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    background-color: #6b7280;
    transition: all 0.3s ease;
}

.status-text-float {
    color: #9ca3af;
    font-size: 0.7rem;
    transition: all 0.3s ease;
}

.action-label {
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
}

.play-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
}

.play-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
}

.play-btn:active:not(:disabled) {
    transform: scale(0.95);
}

.play-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.play-btn i {
    font-size: 1.2rem;
}

.loading-ring {
    position: absolute;
    inset: -3px;
    border: 2px solid rgba(6, 182, 212, 0.2);
    border-top-color: #06b6d4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
}

.loading-ring.active {
    display: block;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
    .station-name {
        font-size: 0.75rem;
    }
    .action-label {
        display: none;
    }
    .play-btn {
        width: 40px;
        height: 40px;
    }
    .play-btn i {
        font-size: 1rem;
    }
    .logo-img {
        height: 32px;
    }
    .floating-footer {
        padding: 6px 12px;
    }
}
</style>
