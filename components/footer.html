<footer class="floating-footer" id="floatingFooter">
    <div class="inner">
        <!-- Izquierda: Logo + Info -->
        <div class="logo-area">
            <div class="relative flex-shrink-0">
                <img src="assets/img/RT.png"
                    class="logo-img"
                    alt="Radio Tropical"
                    onerror="this.src='https://placehold.co/150/06b6d4/ffffff?text=RT'">
                <div class="logo-glow"></div>
            </div>
            <div class="flex flex-col leading-tight truncate min-w-0">
                <h4 class="station-name">Radio Tropical 87.9 FM</h4>
                <div class="status-indicator">
                    <span id="liveIndicatorFloat" class="status-dot-float"></span>
                    <span id="statusTextFloat" class="status-text-float">Señal Digital</span>
                </div>
            </div>
        </div>

        <!-- Derecha: Botón Play con estados de conexión -->
        <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0 pl-1">
            <span id="actionLabel" class="action-label">Escuchar ahora</span>
            <button id="fabRadio" class="play-btn relative overflow-hidden group" aria-label="Reproducir / Pausar">
                <span id="btnIconContainer" class="flex items-center justify-center">
                    <i id="fabIcon" class="fas fa-play transition-transform duration-300 group-hover:scale-110"></i>
                </span>
                <!-- Onda de carga sutil alrededor del botón -->
                <span id="loadingRing" class="absolute inset-0 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin hidden"></span>
            </button>
        </div>
    </div>
</footer>
